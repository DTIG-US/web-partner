<section class="partners-section py-4">
  <div class="container-fluid px-5">
    <div class="row">
      <div class="col-12">
        <div class="partners-grid">
          @for (item of partnersData.partners; track item.name) {
            <a
              [href]="item.url"
              target="_blank"
              rel="noopener noreferrer"
              class="partner-link"
              [attr.aria-label]="item.name"
            >
              <div class="partner-card">
                <img
                  [src]="item.image"
                  [alt]="item.name + ' logo'"
                  class="partner-logo"
                />
              </div>
              <span class="partner-name">{{ item.name }}</span>
            </a>
          }
        </div>
      </div>
    </div>
  </div>
</section>
